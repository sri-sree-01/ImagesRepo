# Add this to ImagesRepo at:  .github/workflows/manifest.yml
#
# On every push that adds/removes files under AIDMWallpaper/, it
# regenerates AIDMWallpaper/manifest.json (the file list the app reads
# from jsDelivr) and purges the jsDelivr cache so the change shows up in
# the app quickly. Fully automatic - you just commit your images/mp3s.

name: Build manifest

on:
  push:
    branches: [main]
    paths:
      - "AIDMWallpaper/**"
      - "!AIDMWallpaper/manifest.json"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate manifest.json
        run: |
          node -e '
            const fs = require("fs"), path = require("path");
            const out = [];
            function walk(dir) {
              for (const e of fs.readdirSync(dir, { withFileTypes: true })) {
                const p = path.join(dir, e.name).split(path.sep).join("/");
                if (e.isDirectory()) walk(p);
                else if (p !== "AIDMWallpaper/manifest.json") out.push(p);
              }
            }
            walk("AIDMWallpaper");
            out.sort();
            fs.writeFileSync(
              "AIDMWallpaper/manifest.json",
              JSON.stringify({ generatedAt: new Date().toISOString(), count: out.length, files: out }, null, 1)
            );
            console.log("manifest files:", out.length);
          '

      - name: Commit manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add AIDMWallpaper/manifest.json
          git diff --cached --quiet || git commit -m "chore: update manifest [skip ci]"
          git push

      - name: Purge jsDelivr cache
        run: |
          curl -s "https://purge.jsdelivr.net/gh/sri-sree-01/ImagesRepo@main/AIDMWallpaper/manifest.json" || true
